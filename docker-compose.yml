# The project name is fixed so the node_modules volume does not depend on the folder name.
name: dev_inventory

services:
  build:
    build: .
    image: obsidian-inventory-ui-dev
    working_dir: /app
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    command: npm run dev
    tty: true

volumes:
  node_modules:
